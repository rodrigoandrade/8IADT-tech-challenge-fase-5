services:

  postgres:
    image: postgres:16-alpine
    container_name: real-estate-sdr-postgres

    environment:
      POSTGRES_DB: real_estate_sdr
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d real_estate_sdr"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  migrate:
    image: migrate/migrate:v4.19.1
    container_name: real-estate-sdr-migrate

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ./backend/migrations:/migrations:ro

    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://postgres:postgres@postgres:5432/real_estate_sdr?sslmode=disable",
        "up"
      ]

    restart: "no"


  api:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: real-estate-sdr-api

    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/real_estate_sdr?sslmode=disable
      PORT: 8080

    ports:
      - "8080:8080"

    restart: unless-stopped


volumes:
  postgres_data: