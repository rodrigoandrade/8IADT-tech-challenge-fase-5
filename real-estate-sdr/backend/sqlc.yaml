version: "2"

sql:
  - engine: "postgresql"

    schema: "migrations"

    queries: "queries"

    gen:
      go:
        package: "postgres"
        out: "internal/infrastructure/postgres/generated"

        sql_package: "pgx/v5"

        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true

        overrides:
          - db_type: "uuid"
            nullable: false
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"